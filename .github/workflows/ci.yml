name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run production-readiness contract tests
        run: node --test test/unit/production-readiness.test.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/agenda_ci_test?replicaSet=rs0&directConnection=true
      SESSION_SECRET: ci-only-session-secret-not-for-production
      FRONTEND_URL: http://localhost:4321
      BACKEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:4321
      GOOGLE_CLIENT_ID: ci-google-client-id
    defaults:
      run:
        working-directory: Server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Start isolated MongoDB replica set
        run: |
          docker run --rm -d --name agenda-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          until docker exec agenda-mongo mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'; do sleep 1; done
          docker exec agenda-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          until docker exec agenda-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

      - name: Run controlled production-readiness smoke
        run: node --test --test-force-exit test/jProductionSmoke.test.js

      - name: Rehearse Mongo backup and isolated restore
        run: |
          set -euo pipefail
          docker exec agenda-mongo mongosh --quiet agenda_ci_test --eval 'db.j_backup_rehearsal.updateOne({_id:"phase-j"},{$set:{marker:"safe-non-production"}},{upsert:true})'
          docker exec agenda-mongo mongodump --quiet --db agenda_ci_test --archive=/tmp/agenda-j-rehearsal.archive
          docker exec agenda-mongo mongorestore --quiet --archive=/tmp/agenda-j-rehearsal.archive --nsFrom='agenda_ci_test.*' --nsTo='agenda_j_restore_rehearsal.*' --drop
          RESTORED_MARKER="$(docker exec agenda-mongo mongosh --quiet agenda_j_restore_rehearsal --eval 'db.j_backup_rehearsal.countDocuments({_id:"phase-j",marker:"safe-non-production"})')"
          test "$RESTORED_MARKER" = "1"
          docker exec agenda-mongo mongosh --quiet agenda_j_restore_rehearsal --eval 'db.dropDatabase()'
          docker exec agenda-mongo mongosh --quiet agenda_ci_test --eval 'db.j_backup_rehearsal.deleteOne({_id:"phase-j"})'

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      PUBLIC_API_URL: http://localhost:3000/api
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend policy tests
        run: npm run test:frontend

      - name: Run Astro checks
        run: npm run check

      - name: Run strict TypeScript checks
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan tracked files with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        with:
          args: detect --source=/github/workspace --no-git --redact --no-banner --verbose

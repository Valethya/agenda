name: Generate Astro security lockfile

on:
  push:
    branches:
      - hotfix/frontend-astro-security

permissions:
  contents: write

env:
  ASTRO_TELEMETRY_DISABLED: 1
  PUBLIC_API_URL: http://localhost:3000/api

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/frontend-astro-security

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Update Astro security dependencies
        working-directory: Client
        run: npm install astro@^7.3.2 @astrojs/react@^6.0.5 @astrojs/check@^0.9.10 --save

      - name: Verify frontend
        working-directory: Client
        run: |
          npm run test:frontend
          npm run check
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=critical

      - name: Commit generated dependency files
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: fix(security): upgrade Astro frontend dependencies
          file_pattern: Client/package.json Client/package-lock.json
